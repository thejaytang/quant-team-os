[project]
name = "quant-team-os-api"
version = "0.4.0"
description = "FastAPI backend for Quant Team OS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "openai-agents>=0.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-jose[cryptography]>=3.3",
  "prometheus-client>=0.20",
  "temporalio>=1.7",
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-exporter-otlp>=1.26",
  "boto3>=1.34",
  "pandas>=2.2,<3",
  "pyarrow>=16",
  "duckdb>=1.0",
  "mlflow>=2.14",
  "dlt>=1.0",
  "great-expectations>=1.0",
  "dvc[s3]>=3.50",
  "langfuse>=2.40",
  "pyqlib",
  "rdagent",
  "alphalens-reloaded",
  "quantstats",
  "PyPortfolioOpt"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
