global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: temporal
    static_configs:
      - targets: ["temporal:9091"]
  - job_name: workers
    static_configs:
      - targets: ["workers:9002"]
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: opa
    metrics_path: /metrics
    static_configs:
      - targets: ["opa:8181"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
