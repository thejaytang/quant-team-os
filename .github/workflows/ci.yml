name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -e apps/api pytest ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/v1.18.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
      - name: Install Node dependencies
        run: npm ci
      - name: Run tests
        run: npm test
